[project]
name = "desk-robot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vinnie Salvoni", email = "ID+Vinnie-Salvoni@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "feedparser>=6.0.14",
    "requests>=2.34.2",
    "sounddevice>=0.5.6",
    "faster-whisper>=1.2.1",
    "pyttsx3>=2.99",
]

[project.scripts]
desk-robot = "desk_robot:main"

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
